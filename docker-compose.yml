services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     encyclopedia
      POSTGRES_PASSWORD: encyclopedia
      POSTGRES_DB:       encyclopedia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encyclopedia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=encyclopedia;Username=encyclopedia;Password=encyclopedia"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
