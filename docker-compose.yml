services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     encyclopedia
      POSTGRES_PASSWORD: encyclopedia
      POSTGRES_DB:       encyclopedia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encyclopedia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=encyclopedia;Username=encyclopedia;Password=encyclopedia"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      # Container always listens on 8080; published on the host at
      # ${ENCYCLOPEDIA_HOST_PORT}, defaulting to 8190 (uncommon enough to
      # dodge nextcloud's host:8080 and other typical dev services).
      - "${ENCYCLOPEDIA_HOST_PORT:-8190}:8080"

volumes:
  pgdata:
